name: printvault

services:
  printvault:
    build: .
    image: printvault:local
    container_name: printvault
    restart: unless-stopped
    user: "${UID:-1000}:${GID:-1000}"
    env_file: .env
    environment:
      LIVE_URL: http://printvault-mqtt:8101/live
    ports:
      # Only this machine by default. PRINTVAULT_BIND=0.0.0.0 in .env opens it to the LAN;
      # Printvault has no login, so only do that on a network you trust.
      - "${PRINTVAULT_BIND:-127.0.0.1}:8100:5000"
    volumes:
      - ./data:/data
    networks:
      - printvault

  # Listens (read-only) via MQTT to the printers that have an IP, serial number and access code
  # in Printvault. Live status on :8101, only reachable inside the printvault network.
  printvault-mqtt:
    image: printvault:local
    container_name: printvault-mqtt
    restart: unless-stopped
    user: "${UID:-1000}:${GID:-1000}"
    env_file: .env
    environment:
      LIVE_HOST: 0.0.0.0
      LIVE_PORT: "8101"
    command: ["python", "-u", "mqtt_listener.py"]
    depends_on:
      - printvault
    volumes:
      - ./data:/data
    networks:
      - printvault

networks:
  printvault:
    name: printvault
