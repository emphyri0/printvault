# Runs the test suite on every push and pull request (Forgejo Actions, own runner).
# Same steps as .github/workflows/tests.yml; keep both files in step.
name: Tests

on: [push, pull_request]

jobs:
  tests:
    runs-on: ubuntu-latest
    container:
      image: python:3.12-slim   # same Python as the Dockerfile
    steps:
      - name: Install ffmpeg (thumbnail tests), git and Node.js (for the checkout action)
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ffmpeg git nodejs ca-certificates
      - name: Check out
        uses: actions/checkout@v4
      - name: Install Python dependencies
        run: pip install --no-cache-dir --root-user-action=ignore -r requirements.txt
      - name: Run tests
        env:
          REQUIRE_FFMPEG: "1"   # fail instead of skipping the thumbnail tests when ffmpeg is missing
        run: python -m unittest discover -s tests -v
